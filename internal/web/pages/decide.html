{{define "decide.html"}}<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>qslotter - Inbox</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/live.js" defer></script>
</head><body data-live="decide">
<header class="site">
  <h1>qslotter</h1>
  {{template "nav" .}}
</header>
<main>
  <h2>Inbox, card by card</h2>
  {{template "decide_content.html" .}}
</main>
<script>
// Keyboard: one key = one decision. y (or j) yes, card; n no card; w arms
// "written now", then b or d picks the route (two keys, so a slip cannot mark
// a card sent); arrows browse. A decision shows the next card.
(function() {
  var armed = false;
  function arm(on) {
    armed = on;
    document.querySelectorAll('#decide .written-now').forEach(function(el) { el.classList.toggle('armed', on); });
  }
  document.addEventListener('htmx:afterSwap', function() { arm(false); });
  document.addEventListener('keydown', function(ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    var k = ev.key.toLowerCase();
    if (k === 'j') k = 'y';
    if (k === 'w') { ev.preventDefault(); arm(!armed); return; }
    if (armed) {
      arm(false);
      if (k !== 'b' && k !== 'd') return;
      k = 'w' + k;
    }
    var btn = document.querySelector('#decide button[data-key="' + k + '"]');
    if (!btn) return;
    ev.preventDefault();
    btn.click();
  });
})();
</script>
</body></html>{{end}}
