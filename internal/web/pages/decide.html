{{define "decide.html"}}<!DOCTYPE html>
<html lang="{{lang}}"><head><meta charset="utf-8"><title>qslotter - {{t "Inbox"}}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
<script>window.qslT = {{jsT}};</script>
<script src="/static/app.js"></script>
<script src="/static/live.js" defer></script>
</head><body data-area="inbox" data-live="decide">
<header class="site">
  <h1>qslotter</h1>
  {{template "nav" .}}
</header>
<div class="band"><div class="band-in">
    <div class="band-title"><h2>{{t "Inbox"}}</h2><p>{{t "Which QSOs get a card?"}}</p></div>
    <div class="views" role="group" aria-label="{{t "View"}}"><a href="/queue">{{t "List"}}</a><a class="on" href="/decide" aria-current="page">{{t "card by card"}}</a>
      <button hx-post="/queue/recompute" hx-target="#recompute-msg" hx-swap="innerHTML" title="{{t "Recompute queue"}}">&#8635;</button><span id="recompute-msg"></span></div>
  </div></div>
<main>
  {{template "decide_content.html" .}}
</main>
<script src="/static/keys.js"></script>
<script>qslKeys.inbox()</script>
</body></html>{{end}}
