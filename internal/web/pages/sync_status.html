{{define "sync_status.html"}}
{{if .LastPull}}<span class="ok">last pull: {{since .LastPull}} ago</span>{{else}}<span class="muted">never pulled</span>{{end}}
{{if .LastPush}}<span class="ok">last push: {{since .LastPush}} ago</span>{{else}}<span class="muted">never pushed</span>{{end}}
{{if .PullErr}}<span class="err">{{.PullErr}}</span>{{end}}
{{if .PushErr}}<span class="err">{{.PushErr}}</span>{{end}}
{{end}}
