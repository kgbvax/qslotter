{{define "nav"}}{{$c := counts}}<nav>
  <a href="/log">Log</a>

  <a href="/decide" title="Decision queue, card by card">Decide</a>
  <a href="/work" title="Work queue: cards to print or write, list">Work{{if $c.Work}} <span class="cnt">{{$c.Work}}</span>{{end}}</a>
  <a href="/work/card" title="Work queue, card by card">Cards</a>
  <a href="/done" title="Finished cards">Done</a>
  <a href="/receive">Receive</a>
  <a href="/settings">Settings</a>
  {{if $c.Push}}<span class="pending" title="Local QSL state not yet pushed to Clublog">{{$c.Push}} to push</span>{{end}}
</nav>{{end}}
