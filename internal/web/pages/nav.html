{{define "nav"}}{{$c := counts}}<nav>
  <span class="areas">
    <a data-area="inbox" href="/queue" title="{{t "New QSOs: card or not?"}}">{{t "New QSOs"}}{{if $c.New}} <span class="cnt">{{$c.New}}</span>{{end}}</a>
    <a data-area="desk" href="/work" title="{{t "Desk: write or print the cards"}}">{{t "Desk"}}{{if $c.Work}} <span class="cnt">{{$c.Work}}</span>{{end}}</a>
    <a data-area="incoming" href="/receive" title="{{t "Incoming QSLs: record received cards, send yours back"}}">{{t "Incoming QSLs"}}{{if $c.Expected}} <span class="cnt exp" title="{{t "requested cards not arrived yet"}}">{{$c.Expected}}</span>{{end}}</a>
  </span>
  <span class="secondary">
    <a data-area="log" href="/log">{{t "Log"}}</a>
    <a data-area="done" href="/done" title="{{t "Finished cards"}}">{{t "Done"}}</a>
    <a data-area="settings" href="/settings">{{t "Settings"}}</a>
    <button type="button" class="mini view-switch" data-view="compact" title="{{t "Switch this window to the small compact list"}}" hidden>{{t "compact"}}</button>
    {{if $c.Push}}<span class="pending" title="{{t "Local QSL state not yet pushed to Clublog"}}">{{t "%d to push" $c.Push}}</span>{{end}}
  </span>
</nav>{{end}}
