# d2-text: the model only reads the text. Every question asks whether the
# qslmgr field or the bio *names* something - no rule needs the flags, the
# address or another answer. Code composes the status (a route named =
# paper, a refusal and no route = no paper, neither = unknown), drops direct
# without a full postal address (address_guard) and applies the flag rule
# and the DCL rule (flags: code), as prompt v11+ does for the chat models.
# d1 asked the model to apply these rules itself, and it mostly failed at
# the conjunctions ("direct" named + a full address -> direct was answered
# false in 20 of 100 stations).
#
# Thresholds: a small decision model answers an absent mention with 0.5-0.9
# (the plausibility of the route, not what the text says), so the cut per
# question is fitted on labelled answers (tev1, eval/qpc fitted against
# eval/qpc2 and the other way round, 2026-10-09: the optimum is flat around
# these values; the refusal cut hardly matters because the flag rule covers
# mqsl 0).
flags: code
questions:
  refused:
    type: noul
    threshold: 0.5
    instructions: >-
      This is an amateur radio station's QRZ record (the qslmgr field holds
      QSL instructions, the bio is free text in any language). Does the text
      say that paper QSL cards (postcards confirming a radio contact) are not
      wanted or not sent: "no QSL", "no paper QSL", "no cards", "eQSL only",
      "LoTW only", "no bureau, no direct", "keine Papier-QSL"? A list of
      electronic services (eQSL, LoTW, Club Log, QRZ logbook, HRDLog) without
      such a refusal is not a refusal. "No bureau" alone is not a refusal of
      paper cards.
  bureau:
    type: noul
    threshold: 0.7
    instructions: >-
      Does the text name the QSL bureau as a way to send paper cards: "via
      bureau", "buro", "Büro", "QSL via DARC", "bureau OK", "бюро"? "No
      bureau", "not a bureau member" or "bureau not supported" means false. A
      bureau named as not wanted means false.
  direct:
    type: noul
    threshold: 0.8
    instructions: >-
      Does the text name direct mail as a way to send paper cards: "direct",
      "direkt", "via direct", "SAE", "SASE", "IRC", "green stamps", "2 USD",
      "P.O. Box", or a postal address written in the text? Ignore whether a
      postal address is on file; only what the text says counts. "No direct"
      means false.
  oqrs:
    type: noul
    threshold: 0.9
    instructions: >-
      Does the text name an online QSL request service: "OQRS", "Club Log
      OQRS", "request your card on Club Log", "cards on request via
      Clublog"? Club Log, LoTW or eQSL named only as a log or an electronic
      confirmation is not OQRS.
  preferred:
    type: choice
    instructions: >-
      Which route does the text say the station prefers for paper cards
      ("direct preferred", "bureau if possible", "please via bureau", "direct
      only if ...")?
    criteria:
      none: No preference is stated, or only one route is named.
      bureau: It prefers the bureau.
      direct: It prefers direct.
      oqrs: It prefers OQRS.
  contribution:
    type: choice
    instructions: >-
      Does the text ask for something in return for a paper card: return
      postage (SAE, SASE, IRC, green stamps), money (USD, EUR), PayPal or a
      fee?
    criteria:
      required: It asks for one.
      not-needed: It says explicitly that none is needed ("no SASE needed", "free of charge").
      not-stated: The text does not say.
