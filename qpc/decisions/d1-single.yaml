# d1-single: the whole answer as one choice (status or the set of accepted
# routes), plus the preferred route and the contribution flag. Same rules as
# d1-split. A decision model cannot write, so there is no note and no via
# callsign.
questions:
  answer:
    type: choice
    instructions: >-
      This is an amateur radio station's QRZ record. How can a paper QSL card
      (a postcard confirming a radio contact) be sent to the station? Pick the
      option with every route it accepts. Only the record counts. A paper
      route named in qslmgr or the bio wins over mqsl. eQSL, LoTW, Club Log and
      the QRZ logbook are not paper routes. Direct needs a full postal address
      on QRZ or in the bio.
    criteria:
      bureau: >-
        Via the QSL bureau (buro, Büro) only. Also mqsl yes, nothing else said
        about QSL cards and no full postal address.
      direct: >-
        Direct by post only (direct, direkt, SAE, SASE, IRC). Also a full
        postal address, nothing said about QSL cards and mqsl not no.
      bureau+direct: Bureau and direct both accepted.
      oqrs: Only through an online QSL request service (OQRS).
      bureau+oqrs: Bureau and OQRS.
      direct+oqrs: Direct and OQRS.
      bureau+direct+oqrs: Bureau, direct and OQRS.
      no-paper: >-
        Paper cards are refused ("no QSL", "no paper", "eQSL only", "LoTW
        only", "no bureau, no direct"), or mqsl is no and no paper route is
        named anywhere.
      unknown: Nothing about paper QSL cards, mqsl not stated and no full postal address.
      unclear: >-
        Paper cards are wanted but no usable route is given: a QSL manager
        callsign without a route, or direct only without a postal address.
  preferred:
    type: choice
    instructions: Which route does the station say it prefers for paper cards ("direct preferred", "bureau if possible")?
    criteria:
      none: No preference is stated.
      bureau: It prefers the bureau.
      direct: It prefers direct.
      oqrs: It prefers OQRS.
  contribution:
    type: choice
    instructions: >-
      Does the station ask for something in return for a paper card: return
      postage (SAE, SASE, IRC, green stamps), money (USD, EUR), PayPal or a
      fee?
    criteria:
      required: It asks for one.
      not-needed: It says explicitly that none is needed ("no SASE needed", "free of charge").
      not-stated: The record does not say.
