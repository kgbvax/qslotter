# d1-split: the answer as separate questions - a status choice, true/false
# for each route, the preferred route and the contribution flag. The rules of
# qpc/LABELS.md, shortened to fit Tev1's context of about 2,000 tokens. A
# decision model cannot write, so there is no note and no via callsign.
questions:
  status:
    type: choice
    instructions: >-
      This is an amateur radio station's QRZ record. Can a paper QSL card (a
      postcard confirming a radio contact) be sent to the station? Only the
      record counts. A paper route named in qslmgr or the bio wins over mqsl.
      eQSL, LoTW, Club Log and the QRZ logbook are not paper routes.
    criteria:
      paper: >-
        Paper cards are accepted on a usable route: bureau, direct by post
        (needs a full postal address) or OQRS. Also when nothing is said about
        QSL cards but there is a full postal address and mqsl is not no, or
        mqsl is yes.
      no-paper: >-
        Paper cards are refused ("no QSL", "no paper", "eQSL only", "LoTW
        only", "no bureau, no direct"), or mqsl is no and no paper route is
        named anywhere.
      unknown: Nothing about paper QSL cards, mqsl not stated and no full postal address.
      unclear: >-
        Paper cards are wanted but no usable route is given: a QSL manager
        callsign without a route, or direct only without a postal address.
  bureau:
    type: noul
    instructions: >-
      Does the station accept paper cards via the QSL bureau (buro, Büro)?
      "No bureau" means false. mqsl yes, nothing else said about QSL cards and
      no full postal address also means true.
  direct:
    type: noul
    instructions: >-
      Does the station accept paper cards sent direct by post (direct,
      direkt, SAE, SASE, IRC, green stamps)? Direct needs a full postal
      address on QRZ or in the bio. A full postal address with nothing said
      about QSL cards and mqsl not no also means true.
  oqrs:
    type: noul
    instructions: Does the station accept card requests through an online QSL request service (OQRS, Club Log OQRS)?
  preferred:
    type: choice
    instructions: Which route does the station say it prefers for paper cards ("direct preferred", "bureau if possible")?
    criteria:
      none: No preference is stated.
      bureau: It prefers the bureau.
      direct: It prefers direct.
      oqrs: It prefers OQRS.
  contribution:
    type: choice
    instructions: >-
      Does the station ask for something in return for a paper card: return
      postage (SAE, SASE, IRC, green stamps), money (USD, EUR), PayPal or a
      fee?
    criteria:
      required: It asks for one.
      not-needed: It says explicitly that none is needed ("no SASE needed", "free of charge").
      not-stated: The record does not say.
