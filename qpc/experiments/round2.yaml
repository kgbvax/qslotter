# Round 2: the postal address (prompt v2, LABELS.md rules 5-6), alone and
# with the code check that turns direct without a full QRZ address into
# unclear. Run together with round1.yaml (v1) on the same dataset.
defaults:
  base_url: http://localhost:11434/v1
  prompt: v2
  temperature: 0
  max_tokens: 512
  bio_max_chars: 6000
  format: schema
  timeout: 3m
  extra:
    reasoning_effort: none

variants:
  - {name: qwen3.5-4b-v2, model: "qwen3.5:4b"}
  - {name: gemma4-e4b-v2, model: "gemma4:e4b"}
  - {name: ministral3-3b-v2, model: "ministral-3:3b"}
  - {name: qwen3.5-2b-v2, model: "qwen3.5:2b"}
  - {name: llama3.1-8b-v2, model: "llama3.1:8b"}
  - {name: qwen3.5-4b-v2-guard, model: "qwen3.5:4b", address_guard: true}
  - {name: gemma4-e4b-v2-guard, model: "gemma4:e4b", address_guard: true}
  - {name: ministral3-3b-v2-guard, model: "ministral-3:3b", address_guard: true}
  - {name: qwen3.5-2b-v2-guard, model: "qwen3.5:2b", address_guard: true}
  - {name: llama3.1-8b-v2-guard, model: "llama3.1:8b", address_guard: true}
