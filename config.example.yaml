# qslotter - QSL card handling, DL9ET style
#
# Runtime configuration. Copy to config.yaml and edit.
# Secrets can be sourced from environment variables via ${VAR}.

server:
  addr: 127.0.0.1:8473   # loopback only. 0.0.0.0:8473 = all IPv4 interfaces (reachable from the LAN;
                         # the UI has no login - trusted network only, and open the firewall for it)

station:
  name: Ingo           # your name, printed on cards (my_name field)
  qth: ""              # your QTH / address line (optional)

udp:
  listen: 127.0.0.1:1273    # Log4OM ADIF broadcast destination (see README)

clublog:
  email: dl9et@example.com
  app_password: ${CLUBLOG_APP_PASSWORD}
  call: DL9ET
  api_key: ${CLUBLOG_API_KEY}
  pull_interval: 1h          # background reconciliation pull; 0 or omitted = off
  push_interval: 0s          # background push-back of QSL state; 0s or omitted = off

qrz:
  username: dl9et
  password: ${QRZ_PASSWORD}
  agent: qslotter/1.0
  cache_ttl: 168h

printer:
  name: ""              # empty = system default
  command: ""           # auto-detect; on Windows, path to bundled SumatraPDF
  paper_size_mm: [140, 90]
  paper: ""             # the printer's paper (form) by name, e.g. "QSL 140x90"; "" = the one of paper_size_mm
                        # (Windows: add a form of the card's size under Print server properties > Forms)
  rotate: 0             # 90 or 270 turns the card on its way to the printer (Windows), if it prints across the card
  tray: ""              # paper source, e.g. "Manual Feed"; "" = the printer's default
                        # (both chosen under Settings > Cards & printer on Windows)
  offset_mm: [0, 0]     # x, y in mm: shifts every print to make up for the printer's feed
                        # (measure a test card under Settings > Cards & printer)

card:
  template: ""          # active card layout: cards/<name>.yaml, edited under Settings > Cards & printer;
                        # "" = the built-in layout
  # export_dir: exports   # ADIF files for a QSL print service; default: "exports" next to the database

qualify:
  include_digital: false      # true: FT8/FT4/FT2, FST4, JS8, WSPR, MSK144 enter the queue too (also under Settings)
  exclude_modes: []           # further modes to skip (exact names); digital modes follow include_digital
  first_contact_only: false   # false: repeat contacts enter the queue, shown with their history
  override_marker: "QSL!"     # in a QSO's notes: force it into the queue (never if a card was already sent)
  since: ""                   # only QSOs on/after this date enter the queue. "" = the day qslotter first
                              # ran, YYYY-MM-DD = that day, "all" = import the whole Clublog backlog

receive:
  overdue_weeks: 12           # a card requested via OQRS, PayPal ... counts as overdue after this many weeks

store:
  driver: sqlite        # v1 only supports sqlite; v2 will add couchdb
  path: qslotter.db

ui:
  mode: window          # window (own app window + tray) | browser (browser app windows) | headless (server only)
  language: ""          # "" = the browser's / system's language; "de", "en" (also under Settings)
